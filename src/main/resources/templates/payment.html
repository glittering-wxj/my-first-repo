<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>订单支付</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .payment-container {
            max-width: 600px;
            margin: 100px auto;
            padding: 40px;
            background-color: #fff;
            border-radius: 8px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="payment-container">
        <h2>订单支付</h2>
        <div style="margin: 30px 0;">
            <p>订单号：<span id="orderNo"></span></p>
            <p style="font-size: 24px; color: #e74c3c; margin-top: 20px;">
                支付金额：¥<span id="amount"></span>
            </p>
        </div>
        <div style="margin-top: 40px;">
            <p style="color: #666; margin-bottom: 20px;">模拟支付环境</p>
            <button class="btn btn-primary" onclick="confirmPay()" style="font-size: 18px; padding: 15px 40px;">
                确认支付
            </button>
        </div>
    </div>

    <script>
        let orderNo = '';

        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            orderNo = urlParams.get('orderNo');

            if (!orderNo) {
                alert('订单号错误');
                window.location.href = '/';
                return;
            }

            document.getElementById('orderNo').textContent = orderNo;
            loadOrderInfo();
        };

        function loadOrderInfo() {
            fetch('/api/order/detail/' + orderNo)
                .then(response => response.json())
                .then(data => {
                    if (data.code === 200) {
                        document.getElementById('amount').textContent = data.data.totalAmount;
                    } else {
                        alert(data.message);
                        window.location.href = '/';
                    }
                });
        }

        function confirmPay() {
            fetch('/api/order/pay?orderNo=' + orderNo, {
                method: 'POST'
            })
            .then(response => response.json())
            .then(data => {
                if (data.code === 200) {
                    window.location.href = '/payment/success?orderNo=' + orderNo;
                } else {
                    alert(data.message);
                }
            });
        }
    </script>
</body>
</html>
