<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人中心</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .profile-container {
            max-width: 1000px;
            margin: 20px auto;
        }
        .profile-card {
            background-color: #fff;
            padding: 30px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .menu-item {
            padding: 15px;
            margin: 10px 0;
            background-color: #f8f9fa;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .menu-item:hover {
            background-color: #e9ecef;
            transform: translateX(5px);
        }
        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 15px 0;
            border-bottom: 1px solid #eee;
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <nav class="navbar">
                <a href="/" class="logo">网上商城</a>
                <ul class="nav-menu">
                    <li><a href="/">首页</a></li>
                    <li><a href="/cart">购物车</a></li>
                    <li><a href="/user/orders">我的订单</a></li>
                    <li><a href="/user/profile" style="color:#e74c3c; font-weight:bold; border-bottom:3px solid #e74c3c; padding-bottom:5px;">个人中心</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container profile-container">
        <div style="display: flex; gap: 20px;">
            <!-- 左侧菜单 -->
            <div style="width: 250px;">
                <div class="profile-card">
                    <h3>个人中心</h3>
                    <div class="menu-item" onclick="showSection('info')">
                        <strong>📋 个人信息</strong>
                    </div>
                    <div class="menu-item" onclick="window.location.href='/user/orders'">
                        <strong>📦 我的订单</strong>
                    </div>
                    <div class="menu-item" onclick="window.location.href='/user/address'">
                        <strong>📍 收货地址</strong>
                    </div>
                    <div class="menu-item" onclick="showSection('password')">
                        <strong>🔒 修改密码</strong>
                    </div>
                    <div class="menu-item" onclick="logout()">
                        <strong>🚪 退出登录</strong>
                    </div>
                </div>
            </div>

            <!-- 右侧内容 -->
            <div style="flex: 1;">
                <!-- 个人信息 -->
                <div id="infoSection" class="profile-card">
                    <h2>个人信息</h2>
                    <div id="userInfo"></div>
                    <button class="btn btn-primary" onclick="showEditForm()" style="margin-top: 20px;">编辑信息</button>
                </div>

                <!-- 编辑信息表单 -->
                <div id="editSection" class="profile-card" style="display: none;">
                    <h2>编辑个人信息</h2>
                    <div class="form-group">
                        <label>用户名</label>
                        <input type="text" id="username" class="form-control" readonly>
                    </div>
                    <div class="form-group">
                        <label>昵称</label>
                        <input type="text" id="nickname" class="form-control">
                    </div>
                    <div class="form-group">
                        <label>手机号</label>
                        <input type="tel" id="phone" class="form-control">
                    </div>
                    <div class="form-group">
                        <label>邮箱</label>
                        <input type="email" id="email" class="form-control">
                    </div>
                    <button class="btn btn-primary" onclick="saveUserInfo()">保存</button>
                    <button class="btn btn-secondary" onclick="cancelEdit()">取消</button>
                </div>

                <!-- 修改密码 -->
                <div id="passwordSection" class="profile-card" style="display: none;">
                    <h2>修改密码</h2>
                    <div class="form-group">
                        <label>原密码</label>
                        <input type="password" id="oldPassword" class="form-control">
                    </div>
                    <div class="form-group">
                        <label>新密码</label>
                        <input type="password" id="newPassword" class="form-control">
                    </div>
                    <div class="form-group">
                        <label>确认新密码</label>
                        <input type="password" id="confirmPassword" class="form-control">
                    </div>
                    <button class="btn btn-primary" onclick="changePassword()">确认修改</button>
                    <button class="btn btn-secondary" onclick="showSection('info')">取消</button>
                </div>
            </div>
        </div>
    </main>

    <script>
        let currentUser = null;

        window.onload = function() {
            loadUserInfo();
        };

        function loadUserInfo() {
            fetch('/api/user/info')
                .then(response => response.json())
                .then(data => {
                    if (data.code === 200) {
                        currentUser = data.data;
                        displayUserInfo();
                    } else {
                        alert('请先登录');
                        window.location.href = '/login';
                    }
                });
        }

        function displayUserInfo() {
            const userInfoDiv = document.getElementById('userInfo');
            userInfoDiv.innerHTML = `
                <div class="info-row">
                    <span><strong>用户名：</strong></span>
                    <span>${currentUser.username}</span>
                </div>
                <div class="info-row">
                    <span><strong>昵称：</strong></span>
                    <span>${currentUser.nickname || '未设置'}</span>
                </div>
                <div class="info-row">
                    <span><strong>手机号：</strong></span>
                    <span>${currentUser.phone || '未设置'}</span>
                </div>
                <div class="info-row">
                    <span><strong>邮箱：</strong></span>
                    <span>${currentUser.email || '未设置'}</span>
                </div>
                <div class="info-row">
                    <span><strong>角色：</strong></span>
                    <span>${currentUser.role === 'admin' ? '管理员' : '普通用户'}</span>
                </div>
                <div class="info-row">
                    <span><strong>注册时间：</strong></span>
                    <span>${new Date(currentUser.createTime).toLocaleString()}</span>
                </div>
            `;
        }

        function showSection(section) {
            document.getElementById('infoSection').style.display = 'none';
            document.getElementById('editSection').style.display = 'none';
            document.getElementById('passwordSection').style.display = 'none';

            if (section === 'info') {
                document.getElementById('infoSection').style.display = 'block';
            } else if (section === 'password') {
                document.getElementById('passwordSection').style.display = 'block';
            }
        }

        function showEditForm() {
            document.getElementById('username').value = currentUser.username;
            document.getElementById('nickname').value = currentUser.nickname || '';
            document.getElementById('phone').value = currentUser.phone || '';
            document.getElementById('email').value = currentUser.email || '';

            document.getElementById('infoSection').style.display = 'none';
            document.getElementById('editSection').style.display = 'block';
        }

        function cancelEdit() {
            document.getElementById('editSection').style.display = 'none';
            document.getElementById('infoSection').style.display = 'block';
        }

        function saveUserInfo() {
            const user = {
                nickname: document.getElementById('nickname').value,
                phone: document.getElementById('phone').value,
                email: document.getElementById('email').value
            };

            fetch('/api/user/update', {
                method: 'PUT',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(user)
            })
            .then(response => response.json())
            .then(data => {
                if (data.code === 200) {
                    alert('更新成功');
                    currentUser = data.data;
                    displayUserInfo();
                    cancelEdit();
                } else {
                    alert(data.message);
                }
            });
        }

        function changePassword() {
            const oldPassword = document.getElementById('oldPassword').value;
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (!oldPassword || !newPassword || !confirmPassword) {
                alert('请填写所有字段');
                return;
            }

            if (newPassword !== confirmPassword) {
                alert('两次新密码输入不一致');
                return;
            }

            if (newPassword.length < 6) {
                alert('密码长度至少6位');
                return;
            }

            const formData = new URLSearchParams();
            formData.append('oldPassword', oldPassword);
            formData.append('newPassword', newPassword);

            fetch('/api/user/changePassword', {
                method: 'POST',
                headers: {'Content-Type': 'application/x-www-form-urlencoded'},
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                if (data.code === 200) {
                    alert('密码修改成功，请重新登录');
                    logout();
                } else {
                    alert(data.message);
                }
            });
        }

        function logout() {
            fetch('/api/user/logout', { method: 'POST' })
                .then(() => {
                    window.location.href = '/login';
                });
        }
    </script>
</body>
</html>
