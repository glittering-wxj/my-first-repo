<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>支付成功</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .success-container {
            max-width: 600px;
            margin: 100px auto;
            padding: 40px;
            background-color: #fff;
            border-radius: 8px;
            text-align: center;
        }
        .success-icon {
            font-size: 60px;
            color: #27ae60;
        }
    </style>
</head>
<body>
    <div class="success-container">
        <div class="success-icon">✓</div>
        <h2 style="margin-top: 20px; color: #27ae60;">支付成功！</h2>
        <p style="margin: 20px 0;">订单号：<span id="orderNo"></span></p>
        <p style="color: #666;">感谢您的购买</p>
        <div style="margin-top: 40px; display: flex; gap: 20px; justify-content: center;">
            <button class="btn btn-primary" onclick="window.location.href='/user/orders'">查看订单</button>
            <button class="btn btn-secondary" onclick="window.location.href='/'">继续购物</button>
        </div>
    </div>

    <script>
        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const orderNo = urlParams.get('orderNo');
            if (orderNo) {
                document.getElementById('orderNo').textContent = orderNo;
            }
        };
    </script>
</body>
</html>
