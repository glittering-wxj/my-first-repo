<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>商品管理</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .admin-header {
            background-color: #2c3e50;
            color: #fff;
            padding: 15px 0;
        }
        .admin-nav {
            display: flex;
            gap: 30px;
        }
        .admin-nav a {
            color: #fff;
            text-decoration: none;
        }
        .admin-nav a:hover {
            color: #3498db;
        }
    </style>
</head>
<body>
    <header class="admin-header">
        <div class="container">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <h2>商城管理系统</h2>
                <nav class="admin-nav">
                    <a href="/admin/products">商品管理</a>
                    <a href="/admin/categories">分类管理</a>
                    <a href="/admin/orders">订单管理</a>
                    <a href="#" onclick="logout()">退出</a>
                </nav>
            </div>
        </div>
    </header>

    <main class="container" style="margin-top: 20px;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h2>商品管理</h2>
            <button class="btn btn-primary" onclick="showAddForm()">添加商品</button>
        </div>

        <!-- 添加/编辑商品表单 -->
        <div id="productForm" style="display: none; background-color: #fff; padding: 20px; border-radius: 4px; margin-bottom: 20px;">
            <h3 id="formTitle">添加商品</h3>
            <input type="hidden" id="productId">
            <div class="form-group">
                <label>商品名称</label>
                <input type="text" id="name" class="form-control" required>
            </div>
            <div class="form-group">
                <label>商品描述</label>
                <textarea id="description" class="form-control" rows="3"></textarea>
            </div>
            <div class="form-group">
                <label>价格</label>
                <input type="number" id="price" class="form-control" step="0.01" required>
            </div>
            <div class="form-group">
                <label>库存</label>
                <input type="number" id="stock" class="form-control" required>
            </div>
            <div class="form-group">
                <label>图片URL</label>
                <input type="text" id="imageUrl" class="form-control">
            </div>
            <div class="form-group">
                <label>分类</label>
                <select id="categoryId" class="form-control" required>
                    <option value="">请选择分类</option>
                </select>
            </div>
            <div class="form-group">
                <label>状态</label>
                <select id="status" class="form-control">
                    <option value="1">上架</option>
                    <option value="0">下架</option>
                </select>
            </div>
            <button class="btn btn-primary" onclick="saveProduct()">保存</button>
            <button class="btn btn-secondary" onclick="hideForm()">取消</button>
        </div>

        <!-- 商品列表 -->
        <div style="background-color: #fff; padding: 20px; border-radius: 4px;">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>名称</th>
                        <th>价格</th>
                        <th>库存</th>
                        <th>分类</th>
                        <th>状态</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="productList"></tbody>
            </table>
        </div>
    </main>

    <script>
        let products = [];
        let categories = [];

        window.onload = function() {
            loadCategories();
            loadProducts();
        };

        function logout() {
            fetch('/api/user/logout', { method: 'POST' })
                .then(() => window.location.href = '/admin/login');
        }

        function loadCategories() {
            fetch('/api/admin/category/list')
                .then(response => response.json())
                .then(data => {
                    if (data.code === 200) {
                        categories = data.data;
                        updateCategorySelect();
                    }
                });
        }

        function updateCategorySelect() {
            const select = document.getElementById('categoryId');
            select.innerHTML = '<option value="">请选择分类</option>';

            categories.forEach(category => {
                const option = document.createElement('option');
                option.value = category.id;
                option.textContent = category.name;
                select.appendChild(option);
            });
        }

        function getCategoryName(categoryId) {
            const category = categories.find(c => c.id === categoryId);
            return category ? category.name : '未分类';
        }

        function loadProducts() {
            fetch('/api/admin/product/list')
                .then(response => response.json())
                .then(data => {
                    if (data.code === 200) {
                        products = data.data;
                        displayProducts();
                    } else if (data.code === 403) {
                        alert('无权访问');
                        window.location.href = '/admin/login';
                    }
                });
        }

        function displayProducts() {
            const tbody = document.getElementById('productList');
            tbody.innerHTML = '';

            products.forEach(product => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${product.id}</td>
                    <td>${product.name}</td>
                    <td>¥${product.price}</td>
                    <td>${product.stock}</td>
                    <td>${getCategoryName(product.categoryId)}</td>
                    <td>${product.status === 1 ? '上架' : '下架'}</td>
                    <td>
                        <button class="btn btn-secondary" onclick="editProduct(${product.id})" style="margin-right: 5px;">编辑</button>
                        ${product.status === 1 ?
                            '<button class="btn btn-secondary" onclick="offSale(' + product.id + ')">下架</button>' :
                            '<button class="btn btn-primary" onclick="onSale(' + product.id + ')">上架</button>'}
                        <button class="btn btn-secondary" onclick="deleteProduct(${product.id})" style="margin-left: 5px;">删除</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function showAddForm() {
            document.getElementById('formTitle').textContent = '添加商品';
            document.getElementById('productId').value = '';
            document.getElementById('name').value = '';
            document.getElementById('description').value = '';
            document.getElementById('price').value = '';
            document.getElementById('stock').value = '';
            document.getElementById('imageUrl').value = '';
            document.getElementById('categoryId').value = '';
            document.getElementById('status').value = '1';
            document.getElementById('productForm').style.display = 'block';
        }

        function hideForm() {
            document.getElementById('productForm').style.display = 'none';
        }

        function editProduct(id) {
            // 滚动到页面顶部
            window.scrollTo({ top: 0, behavior: 'smooth' });

            const product = products.find(p => p.id === id);
            document.getElementById('formTitle').textContent = '编辑商品';
            document.getElementById('productId').value = product.id;
            document.getElementById('name').value = product.name;
            document.getElementById('description').value = product.description || '';
            document.getElementById('price').value = product.price;
            document.getElementById('stock').value = product.stock;
            document.getElementById('imageUrl').value = product.imageUrl || '';
            document.getElementById('categoryId').value = product.categoryId;
            document.getElementById('status').value = product.status;
            document.getElementById('productForm').style.display = 'block';
        }

        function saveProduct() {
            const id = document.getElementById('productId').value;
            const product = {
                name: document.getElementById('name').value,
                description: document.getElementById('description').value,
                price: parseFloat(document.getElementById('price').value),
                stock: parseInt(document.getElementById('stock').value),
                imageUrl: document.getElementById('imageUrl').value,
                categoryId: parseInt(document.getElementById('categoryId').value),
                status: parseInt(document.getElementById('status').value)
            };

            if (id) {
                product.id = parseInt(id);
            }

            const url = id ? '/api/admin/product/update' : '/api/admin/product/create';
            const method = 'POST';

            fetch(url, {
                method: id ? 'PUT' : method,
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(product)
            })
            .then(response => response.json())
            .then(data => {
                if (data.code === 200) {
                    alert('保存成功');
                    hideForm();
                    loadProducts();
                } else {
                    alert(data.message);
                }
            });
        }

        function onSale(id) {
            fetch('/api/admin/product/onSale/' + id, { method: 'PUT' })
                .then(response => response.json())
                .then(data => {
                    if (data.code === 200) {
                        alert('上架成功');
                        loadProducts();
                    } else {
                        alert(data.message);
                    }
                });
        }

        function offSale(id) {
            fetch('/api/admin/product/offSale/' + id, { method: 'PUT' })
                .then(response => response.json())
                .then(data => {
                    if (data.code === 200) {
                        alert('下架成功');
                        loadProducts();
                    } else {
                        alert(data.message);
                    }
                });
        }

        function deleteProduct(id) {
            if (!confirm('确定删除该商品吗？')) return;

            fetch('/api/admin/product/delete/' + id, { method: 'DELETE' })
                .then(response => response.json())
                .then(data => {
                    if (data.code === 200) {
                        alert('删除成功');
                        loadProducts();
                    } else {
                        alert(data.message);
                    }
                });
        }
    </script>
</body>
</html>
