<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>分类管理</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .admin-header {
            background-color: #2c3e50;
            color: #fff;
            padding: 15px 0;
        }
        .admin-nav {
            display: flex;
            gap: 30px;
        }
        .admin-nav a {
            color: #fff;
            text-decoration: none;
        }
        .admin-nav a:hover {
            color: #3498db;
        }
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
        }
        .modal-content {
            background-color: #fff;
            margin: 5% auto;
            padding: 30px;
            border-radius: 8px;
            width: 80%;
            max-width: 600px;
            max-height: 80vh;
            overflow-y: auto;
        }
        .modal-content h3 {
            margin-top: 0;
            margin-bottom: 20px;
            color: #2c3e50;
        }
        .close {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
        }
        .close:hover {
            color: #000;
        }
        .products-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        .products-table th,
        .products-table td {
            padding: 10px;
            text-align: left;
            border: 1px solid #ddd;
        }
        .products-table th {
            background-color: #f8f9fa;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <header class="admin-header">
        <div class="container">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <h2>商城管理系统</h2>
                <nav class="admin-nav">
                    <a href="/admin/products">商品管理</a>
                    <a href="/admin/categories">分类管理</a>
                    <a href="/admin/orders">订单管理</a>
                    <a href="#" onclick="logout()">退出</a>
                </nav>
            </div>
        </div>
    </header>

    <main class="container" style="margin-top: 20px;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h2>分类管理</h2>
            <button class="btn btn-primary" onclick="showAddForm()">添加分类</button>
        </div>

        <!-- 添加/编辑分类表单 -->
        <div id="categoryForm" style="display: none; background-color: #fff; padding: 20px; border-radius: 4px; margin-bottom: 20px;">
            <h3 id="formTitle">添加分类</h3>
            <input type="hidden" id="categoryId">
            <div class="form-group">
                <label>分类名称</label>
                <input type="text" id="name" class="form-control" required>
            </div>
            <div class="form-group">
                <label>分类描述</label>
                <textarea id="description" class="form-control" rows="3"></textarea>
            </div>
            <button class="btn btn-primary" onclick="saveCategory()">保存</button>
            <button class="btn btn-secondary" onclick="hideForm()">取消</button>
        </div>

        <!-- 分类列表 -->
        <div style="background-color: #fff; padding: 20px; border-radius: 4px;">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>名称</th>
                        <th>描述</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="categoryList"></tbody>
            </table>
        </div>
    </main>

    <!-- 查看分类商品的模态框 -->
    <div id="productsModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeProductsModal()">&times;</span>
            <h3 id="modalTitle">分类商品</h3>
            <div id="productsContainer"></div>
        </div>
    </div>

    <script>
        let categories = [];

        window.onload = function() {
            loadCategories();
        };

        function logout() {
            fetch('/api/user/logout', { method: 'POST' })
                .then(() => window.location.href = '/admin/login');
        }

        function loadCategories() {
            fetch('/api/admin/category/list')
                .then(response => response.json())
                .then(data => {
                    if (data.code === 200) {
                        categories = data.data;
                        displayCategories();
                    } else if (data.code === 403) {
                        alert('无权访问');
                        window.location.href = '/admin/login';
                    }
                });
        }

        function displayCategories() {
            const tbody = document.getElementById('categoryList');
            tbody.innerHTML = '';

            categories.forEach(category => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${category.id}</td>
                    <td>${category.name}</td>
                    <td>${category.description || '-'}</td>
                    <td>
                        <button class="btn btn-secondary" onclick="editCategory(${category.id})" style="margin-right: 5px;">编辑</button>
                        <button class="btn btn-primary" onclick="viewProducts(${category.id}, '${category.name}')" style="margin-right: 5px;">查看商品</button>
                        <button class="btn btn-secondary" onclick="deleteCategory(${category.id})">删除</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function showAddForm() {
            document.getElementById('formTitle').textContent = '添加分类';
            document.getElementById('categoryId').value = '';
            document.getElementById('name').value = '';
            document.getElementById('description').value = '';
            document.getElementById('categoryForm').style.display = 'block';
        }

        function hideForm() {
            document.getElementById('categoryForm').style.display = 'none';
        }

        function editCategory(id) {
            window.scrollTo({ top: 0, behavior: 'smooth' });

            const category = categories.find(c => c.id === id);
            document.getElementById('formTitle').textContent = '编辑分类';
            document.getElementById('categoryId').value = category.id;
            document.getElementById('name').value = category.name;
            document.getElementById('description').value = category.description || '';
            document.getElementById('categoryForm').style.display = 'block';
        }

        function saveCategory() {
            const id = document.getElementById('categoryId').value;
            const category = {
                name: document.getElementById('name').value,
                description: document.getElementById('description').value
            };

            if (id) {
                category.id = parseInt(id);
            }

            const url = id ? '/api/admin/category/update' : '/api/admin/category/create';
            const method = id ? 'PUT' : 'POST';

            fetch(url, {
                method: method,
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(category)
            })
            .then(response => response.json())
            .then(data => {
                if (data.code === 200) {
                    alert('保存成功');
                    hideForm();
                    loadCategories();
                } else {
                    alert(data.message);
                }
            });
        }

        function deleteCategory(id) {
            if (!confirm('确定删除该分类吗？删除后该分类下的商品将失去分类关联。')) return;

            fetch('/api/admin/category/delete/' + id, { method: 'DELETE' })
                .then(response => response.json())
                .then(data => {
                    if (data.code === 200) {
                        alert('删除成功');
                        loadCategories();
                    } else {
                        alert(data.message);
                    }
                });
        }

        function viewProducts(categoryId, categoryName) {
            document.getElementById('modalTitle').textContent = `分类「${categoryName}」的商品`;

            fetch('/api/admin/category/' + categoryId + '/products')
                .then(response => response.json())
                .then(data => {
                    if (data.code === 200) {
                        displayProducts(data.data);
                        document.getElementById('productsModal').style.display = 'block';
                    } else {
                        alert(data.message);
                    }
                });
        }

        function displayProducts(products) {
            const container = document.getElementById('productsContainer');

            if (products.length === 0) {
                container.innerHTML = '<p style="text-align: center; color: #666; padding: 20px;">该分类下暂无商品</p>';
                return;
            }

            let html = '<table class="products-table"><thead><tr><th>ID</th><th>商品名称</th><th>价格</th><th>库存</th><th>状态</th></tr></thead><tbody>';

            products.forEach(product => {
                html += `
                    <tr>
                        <td>${product.id}</td>
                        <td>${product.name}</td>
                        <td>¥${product.price}</td>
                        <td>${product.stock}</td>
                        <td>${product.status === 1 ? '上架' : '下架'}</td>
                    </tr>
                `;
            });

            html += '</tbody></table>';
            container.innerHTML = html;
        }

        function closeProductsModal() {
            document.getElementById('productsModal').style.display = 'none';
        }

        // 点击模态框外部关闭
        window.onclick = function(event) {
            const modal = document.getElementById('productsModal');
            if (event.target === modal) {
                closeProductsModal();
            }
        }
    </script>
</body>
</html>
