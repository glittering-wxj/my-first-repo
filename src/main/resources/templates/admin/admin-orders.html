<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>订单管理</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .admin-header {
            background-color: #2c3e50;
            color: #fff;
            padding: 15px 0;
        }
        .admin-nav {
            display: flex;
            gap: 30px;
        }
        .admin-nav a {
            color: #fff;
            text-decoration: none;
        }
        .admin-nav a:hover {
            color: #3498db;
        }
        .order-card {
            background-color: #fff;
            padding: 20px;
            border-radius: 4px;
            margin-bottom: 20px;
        }
        .order-items-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        .order-items-table th,
        .order-items-table td {
            padding: 10px;
            text-align: left;
            border: 1px solid #ddd;
        }
        .order-items-table th {
            background-color: #f8f9fa;
            font-weight: bold;
            color: #333;
        }
        .order-items-table td {
            color: #666;
        }
        .order-items-table tr:hover {
            background-color: #f5f5f5;
        }
        .order-items-table td:nth-child(2),
        .order-items-table td:nth-child(3),
        .order-items-table td:nth-child(4) {
            text-align: center;
        }
        .order-items-table th:nth-child(2),
        .order-items-table th:nth-child(3),
        .order-items-table th:nth-child(4) {
            text-align: center;
        }
    </style>
</head>
<body>
    <header class="admin-header">
        <div class="container">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <h2>商城管理系统</h2>
                <nav class="admin-nav">
                    <a href="/admin/products">商品管理</a>
                    <a href="/admin/categories">分类管理</a>
                    <a href="/admin/orders">订单管理</a>
                    <a href="#" onclick="logout()">退出</a>
                </nav>
            </div>
        </div>
    </header>

    <main class="container" style="margin-top: 20px;">
        <h2>订单管理</h2>
        <div id="orderList" style="margin-top: 20px;"></div>
    </main>

    <script>
        window.onload = function() {
            loadOrders();
        };

        function logout() {
            fetch('/api/user/logout', { method: 'POST' })
                .then(() => window.location.href = '/admin/login');
        }

        function loadOrders() {
            fetch('/api/admin/order/list')
                .then(response => response.json())
                .then(data => {
                    if (data.code === 200) {
                        displayOrders(data.data);
                    } else if (data.code === 403) {
                        alert('无权访问');
                        window.location.href = '/admin/login';
                    }
                });
        }

        function displayOrders(orders) {
            const orderList = document.getElementById('orderList');
            orderList.innerHTML = '';

            if (orders.length === 0) {
                orderList.innerHTML = '<p>暂无订单</p>';
                return;
            }

            orders.forEach(order => {
                const statusText = ['待支付', '已支付', '已发货', '已完成', '已取消'][order.status];
                const statusColor = ['#f39c12', '#3498db', '#9b59b6', '#27ae60', '#95a5a6'][order.status];

                const div = document.createElement('div');
                div.className = 'order-card';
                div.innerHTML = `
                    <div style="display: flex; justify-content: space-between; border-bottom: 1px solid #eee; padding-bottom: 10px;">
                        <div>
                            <p><strong>订单号：</strong>${order.orderNo}</p>
                            <p><strong>用户ID：</strong>${order.userId}</p>
                            <p style="color: #666; font-size: 14px;">${new Date(order.createTime).toLocaleString()}</p>
                        </div>
                        <div>
                            <span style="color: ${statusColor}; font-weight: bold; font-size: 16px;">${statusText}</span>
                        </div>
                    </div>
                    <div style="margin-top: 15px;">
                        <p><strong>收货人：</strong>${order.receiver} ${order.phone}</p>
                        <p><strong>收货地址：</strong>${order.address}</p>
                        <p style="color: #e74c3c; font-size: 18px; margin-top: 10px;"><strong>订单金额：</strong>¥${order.totalAmount}</p>
                        ${order.payTime ? '<p style="color: #666; font-size: 14px;"><strong>支付时间：</strong>' + new Date(order.payTime).toLocaleString() + '</p>' : ''}
                    </div>
                    <div style="margin-top: 15px; text-align: right;">
                        <button class="btn btn-secondary" onclick="viewOrderItems(${order.id})">查看详情</button>
                        ${order.status === 1 ? '<button class="btn btn-primary" onclick="shipOrder(' + order.id + ')">发货</button>' : ''}
                    </div>
                    <div id="items_${order.id}" style="margin-top: 15px; display: none;"></div>
                `;
                orderList.appendChild(div);
            });
        }

        function viewOrderItems(orderId) {
            const itemsDiv = document.getElementById('items_' + orderId);

            if (itemsDiv.style.display === 'block') {
                itemsDiv.style.display = 'none';
                return;
            }

            fetch('/api/admin/order/' + orderId + '/items')
                .then(response => response.json())
                .then(data => {
                    if (data.code === 200) {
                        let html = '<h4 style="margin-bottom: 10px; color: #333;">订单明细</h4><table class="order-items-table"><thead><tr><th>商品名称</th><th>单价</th><th>数量</th><th>小计</th></tr></thead><tbody>';

                        data.data.forEach(item => {
                            html += `
                                <tr>
                                    <td>${item.productName}</td>
                                    <td>¥${item.productPrice}</td>
                                    <td>${item.quantity}</td>
                                    <td>¥${item.totalPrice}</td>
                                </tr>
                            `;
                        });

                        html += '</tbody></table>';
                        itemsDiv.innerHTML = html;
                        itemsDiv.style.display = 'block';
                    }
                });
        }

        function shipOrder(orderId) {
            if (!confirm('确认发货吗？')) return;

            fetch('/api/admin/order/ship/' + orderId, {
                method: 'POST'
            })
            .then(response => response.json())
            .then(data => {
                if (data.code === 200) {
                    alert('发货成功');
                    loadOrders();
                } else {
                    alert(data.message);
                }
            });
        }
    </script>
</body>
</html>
